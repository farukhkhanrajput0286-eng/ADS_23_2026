<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Responsive Layout — Logo / Header / Text / 3 Boxes / Footer</title>
  <style>
    /* Mobile-first responsive layout using CSS Grid */
    :root{
      --gap: 1rem;
      --accent: #e6f1e6;
      --muted: #bfcfd2;
      --pad: 1rem;
      --max-w: 1100px;
    }

    *{box-sizing:border-box}
    body{
      font-family: system-ui, -apple-system, Roboto, 'Segoe UI', Arial;
      margin:0;
      background:white;
      color:#222;
      display:flex;
      justify-content:center;
      padding:1.25rem;
    }

    .container{
      width:100%;
      max-width:var(--max-w);
      background:white;
      border-radius:10px;
      box-shadow:0 6px 18px#ff00ff;
      padding:var(--pad);
    }

    /* Grid layout — stack by default for small screens */
    .layout{
      display:grid;
      gap:var(--gap);
      grid-template-columns: 1fr; /* single column on mobile */
      align-items:start;
    }

    .logo, .header, .text, .footer{
      background:var(--accent);
      border:4px solid rgba(0,0,0,0.03);
      padding:0.75rem 1rem;
      border-radius:6px;
      text-align:center;
      color:var(--muted);
      font-weight:600;
    }

    .boxes{
      display:grid;
      gap:var(--gap);
      grid-template-columns:1fr; /* stack boxes on small screens */
    }

    .box{
      padding:2.5rem 1rem;
      min-height:160px;
      border-radius:6px;
      background:linear-gradient(180deg, #f0f6f8 0%, #eaf2f4 100%);
      border:4px solid rgba(0,0,0,0.03);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      font-weight:600;
    }

    /* Larger screens: place three boxes in a row and a comfortable central layout */
    @media (min-width:720px){
      .layout{
        grid-template-columns: 1fr; /* container still single column but inner boxes row */
      }
      .boxes{
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* Very wide screens: center and reduce paddings */
    @media (min-width:1100px){
      .container{padding:1.5rem}
    }

    /* Footer small text */
    .footer{
      padding:0.75rem;
      font-size:0.95rem;
      color:#b3c5cc;
    }

    /* Optional tiny utility to add subtle labels inside elements for demo */
    .label{opacity:0.85}

  </style>
</head>
<body>
  <div class="container" role="main" aria-label="Demo responsive layout">
    <div class="layout">
      <div class="logo" id="logo">Logo</div>
      <div class="header" id="header">Header</div>
      <div class="text" id="text">Text Area</div>

      <div class="boxes" role="group" aria-label="Three content boxes">
        <div class="box">Box1</div>
        <div class="box">Box2</div>
        <div class="box">Box3</div>
      </div>

      <div class="footer" id="footer">Footer</div>
    </div>
  </div>
</body>
</html>
